name: Verify web app invariants and reproduce browser evidence
on:
  push:
    paths:
      - 'workflow-probe/src/**'
      - 'workflow-probe/fixture/**'
      - 'workflow-probe/tools/**'
      - 'workflow-probe/tests/**'
      - 'workflow-probe/ui/**'
      - 'workflow-probe/package*.json'
      - 'workflow-probe/report/**'
      - '.github/workflows/workflow-probe.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workflow-probe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify published source and archived observation fingerprints
        run: node tools/fingerprint.mjs --check
      - run: npm run probe
      - run: npm run verify
      - run: npm run report
      - run: node tools/check-ui.mjs
      - run: npm run report -- --public
      - run: node tools/fingerprint.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-probe-browser-report
          path: |
            workflow-probe/report
            !workflow-probe/report/**/*.zip
            !workflow-probe/report/**/*.png
