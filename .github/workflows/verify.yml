name: Reproduce evidence and test research wrapper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for transformation controls
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: voice-shift-probe audit --evidence evidence
